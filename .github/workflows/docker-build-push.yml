name: CI/CD Nextcloud (GHCR)

on:
  workflow_dispatch:
    inputs:
      major:
        description: 'Major version'
        required: true
        default: '1'
      minor:
        description: 'Minor version'
        required: true
        default: '0'
      patch:
        description: 'Patch version'
        required: true
        default: '0'
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      deploy:
        description: 'Deploy after build?'
        required: true
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nextcloud-php-${{ github.event.inputs.environment }}
  VERSION: "${{ github.event.inputs.major }}.${{ github.event.inputs.minor }}.${{ github.event.inputs.patch }}.${{ github.run_number }}"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./php/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: 🧹 Keep only latest 2 image versions on GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PACKAGE_NAME="nextcloud-php-${{ github.event.inputs.environment }}"
          OWNER="${{ github.repository_owner }}"

          echo "🔍 Fetching versions for $PACKAGE_NAME ..."
          VERSIONS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions?per_page=100")

          COUNT=$(echo "$VERSIONS" | jq 'length')
          echo "📦 Total versions found: $COUNT"

          if [ "$COUNT" -le 2 ]; then
            echo "✅ Only $COUNT versions exist, nothing to delete."
            exit 0
          fi

          IDS_TO_DELETE=$(echo "$VERSIONS" | jq -r 'sort_by(.created_at) | reverse | .[2:] | .[].id')

          for id in $IDS_TO_DELETE; do
            echo "Deleting version id: $id ..."
            curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/users/$OWNER/packages/container/$PACKAGE_NAME/versions/$id"
            echo "✅ Deleted: $id"
          done

  deploy:
    needs: build
    if: ${{ github.event.inputs.deploy == 'true' }}
    runs-on: self-hosted
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || 'no-approval-needed' }}
    steps:
      - name: Fix permissions on data folder
        run: sudo chown -R $(whoami):$(whoami) . || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy with Docker Compose
        run: |
          export IMAGE_NAME=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          docker compose down
          docker compose pull
          docker compose up -d
