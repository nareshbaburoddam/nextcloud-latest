name: CI/CD Nextcloud

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - qa
          - prod
      deploy:
        description: 'Deploy after build?'
        required: true
        default: false
        type: boolean

env:
  BUILD_NUMBER: ${{ github.run_number }}
  IMAGE_NAME: nareshbaburoddam/nextcloud-php-${{ github.event.inputs.environment }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./php/Dockerfile
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.BUILD_NUMBER }}

      - name: 🧹 Keep only latest 2 image tags on Docker Hub
        run: |
          REPO="${{ env.IMAGE_NAME }}"
          NAMESPACE="${REPO%%/*}"
          REPO_NAME="${REPO#*/}"

          echo "🔐 Getting Docker Hub auth token..."
          TOKEN=$(curl -s -X POST https://hub.docker.com/v2/users/login/ \
            -H "Content-Type: application/json" \
            -d "{\"username\": \"${{ env.DOCKERHUB_USERNAME }}\", \"password\": \"${{ env.DOCKERHUB_TOKEN }}\"}" \
            | jq -r .token)

          echo "🔍 Fetching tags for $NAMESPACE/$REPO_NAME ..."
          TAGS=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/$NAMESPACE/$REPO_NAME/tags/?page_size=100&ordering=last_updated" \
            | jq -r '.results[] | select(.name != "latest") | .name')

          TAG_COUNT=$(echo "$TAGS" | grep -c . || true)
          echo "📦 Numbered tags found: $TAG_COUNT"

          if [ "$TAG_COUNT" -le 2 ]; then
            echo "✅ Only $TAG_COUNT numbered tags exist, nothing to delete."
            exit 0
          fi

          DELETE_TAGS=$(echo "$TAGS" | tail -n +3)
          echo "🗑️ Deleting old tags:"
          echo "$DELETE_TAGS"

          for tag in $DELETE_TAGS; do
            echo "Deleting tag: $tag ..."
            curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/$NAMESPACE/$REPO_NAME/tags/$tag/"
            echo "✅ Deleted: $tag"
          done

  deploy:
    needs: build
    if: ${{ github.event.inputs.deploy == 'true' }}
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Deploy with Docker Compose
        run: |
          export IMAGE_NAME=${{ env.IMAGE_NAME }}
          docker compose down
          docker compose pull
          docker compose up -d
